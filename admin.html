<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prototype Leads | The Delivery Desk</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="The Delivery Desk home">
        <span class="brand-mark">TDD</span>
        <span>
          <strong>The Delivery Desk</strong>
          <small>Prototype lead viewer</small>
        </span>
      </a>
      <nav class="main-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <button class="button primary" type="button" data-export-leads>Export CSV</button>
      </nav>
    </header>

    <main class="section-inner admin-main">
      <div class="section-heading">
        <p class="eyebrow dark">Prototype leads</p>
        <h1><span data-leads-count>0</span> saved enquiries</h1>
        <p>These are stored in this browser for now. Live routing will replace this with CRM, email, Sheets or a partner dashboard.</p>
      </div>
      <p class="empty-state" data-empty-leads>No prototype leads saved yet.</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Reference</th>
              <th>Business</th>
              <th>Name</th>
              <th>Email</th>
              <th>Service</th>
              <th>Area</th>
              <th>Volume</th>
              <th>Issue</th>
            </tr>
          </thead>
          <tbody data-leads-table></tbody>
        </table>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
